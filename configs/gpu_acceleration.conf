# GPU Acceleration Configuration
# Generated by setup_configuration.sh on to. 09. okt. 09:54:05 +0200 2025

[gpu_acceleration]
enable_gpu_acceleration = true
gpu_mode = hybrid
gpu_device_id = 0
gpu_memory_limit = 1073741824  # Convert MB to bytes
gpu_work_group_size = 256
gpu_max_concurrent_operations = 4

# CUDA settings
[cuda]
enable_cuda = true
cuda_device_count = 1
cuda_device_id = 0
cuda_memory_pool_size = 536870912  # Half of total memory
cuda_stream_count = 4
cuda_block_size = 256
cuda_grid_size = 1024

# OpenCL settings
[opencl]
enable_opencl = true
opencl_platform_id = 0
opencl_device_id = 0
opencl_device_type = GPU
opencl_memory_pool_size = 536870912
opencl_queue_count = 4
opencl_work_group_size = 256

# Metal settings (Apple)
[metal]
enable_metal = true
metal_device_id = 0
metal_memory_pool_size = 536870912
metal_queue_count = 4

# Shared GPU Computing
[shared_computing]
enable_shared_gpu = false
gpu_count = 1
gpu_device_ids = 0
work_distribution = workload

# Performance settings
[performance]
gpu_timeout = 5000
gpu_retry_count = 3
gpu_fallback_to_cpu = true
gpu_benchmark_mode = false
gpu_profiling_enabled = false
gpu_memory_optimization = true

# Monitoring
[monitoring]
enable_gpu_monitoring = false
monitor_gpu_usage = false
monitor_gpu_memory = false
monitor_gpu_temperature = false
gpu_monitoring_interval = 1000
